<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AgroSense Admin Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eef7ee;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 90%;
      max-width: 420px;
      padding: 35px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #198754;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <h2 class="text-center">AgroSense</h2>

    <h5 class="text-center mt-3">
      Administrator Login
    </h5>

    <p class="text-center text-muted">
      Sign in to access the admin portal.
    </p>

    <form id="adminLoginForm">

      <div class="mb-3">
        <label class="form-label" for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="Enter admin email"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="Enter admin password"
          required
        >
      </div>

      <button
        type="submit"
        class="btn btn-success w-100"
      >
        Login as Admin
      </button>

    </form>

    <div id="message" class="mt-3 text-center"></div>

    <button
      type="button"
      class="btn btn-outline-secondary w-100 mt-3"
      onclick="window.location.href='/'"
    >
      Back to User Login
    </button>
  </div>

  <script>
    document
      .getElementById("adminLoginForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        const message = document.getElementById("message");

        message.className = "mt-3 text-center text-muted";
        message.textContent = "Checking credentials...";

        try {
          const response = await fetch(
            "http://localhost:5000/api/auth/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
              })
            }
          );

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result.message || "Invalid login credentials."
            );
          }

          const token = result.token || result.accessToken;

          if (!token) {
            throw new Error("Login token was not returned by the server.");
          }

          const adminResponse = await fetch(
            "http://localhost:5000/api/admin/users",
            {
              headers: {
                Authorization: `Bearer ${token}`
              }
            }
          );

          const adminResult = await adminResponse.json();

          if (!adminResponse.ok) {
            throw new Error(
              adminResult.message || "You do not have administrator access."
            );
          }

          localStorage.setItem("agrosense_token", token);

          message.className = "mt-3 text-center text-success";
          message.textContent = "Admin login successful!";

          // Dashboard page will be created in the next step.
          window.location.href = "/admin-dashboard.html";

        } catch (error) {
          message.className = "mt-3 text-center text-danger";
          message.textContent =
            error.message || "Unable to connect to the server.";
        }
      });
  </script>

</body>
</html>
